<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>온라인 견적 문의 | 와이드해운</title><link rel="stylesheet" href="styles.css"><style>body{background:#f5f8fc}.quote-page{max-width:900px;margin:70px auto;padding:0 20px}.form-card{background:#fff;border:1px solid #e1e8f0;border-radius:28px;padding:44px;box-shadow:0 20px 60px rgba(20,45,80,.08)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.form-group{display:flex;flex-direction:column;gap:8px}.form-group.full{grid-column:1/-1}.form-group label{font-size:13px;font-weight:800}.form-group input,.form-group select,.form-group textarea{font:inherit;border:1px solid #d5dfeb;border-radius:12px;padding:13px 14px;outline:0}.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#0f8eac;box-shadow:0 0 0 4px rgba(15,142,172,.1)}.back{display:inline-block;margin-bottom:25px;color:#0f4c81;font-weight:800;font-size:13px}.submit{margin-top:24px;width:100%;border:0;background:#061a45;color:#fff;border-radius:13px;padding:16px;font:inherit;font-weight:800;cursor:pointer}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.form-card{padding:25px 18px}}</style></head><body><div class="quote-page"><a class="back" href="index.html">← 와이드해운 홈페이지</a><div class="form-card"><p class="eyebrow">ONLINE QUOTATION</p><h1 style="font-size:38px;line-height:1.2;color:#061a45;margin:0 0 10px">온라인 견적 문의</h1><p style="color:#71809a;margin-bottom:32px">아래 내용을 남겨주시면 담당자가 확인 후 빠르게 안내드리겠습니다.</p><form onsubmit="submitQuote(event)"><div class="form-grid"><div class="form-group"><label>회사명 *</label><input id="company" required></div><div class="form-group"><label>담당자명 *</label><input id="name" required></div><div class="form-group"><label>연락처 *</label><input id="phone" type="tel" required></div><div class="form-group"><label>이메일 *</label><input id="email" type="email" required></div><div class="form-group"><label>운송수단 *</label><select id="mode"><option>해상 FCL</option><option>해상 LCL</option><option>항공 운송</option></select></div><div class="form-group"><label>희망 출항일</label><input id="etd" type="date"></div><div class="form-group"><label>출발지 *</label><input id="origin" placeholder="예: BUSAN" required></div><div class="form-group"><label>도착지 *</label><input id="dest" placeholder="예: LOS ANGELES" required></div><div class="form-group full"><label>품목명 *</label><input id="cargo" placeholder="예: 전자부품, 일반공업제품" required></div><div class="form-group"><label>총 중량 (kg) *</label><input id="weight" type="number" required></div><div class="form-group"><label>인코텀즈</label><select id="inc"><option>EXW</option><option>FCA</option><option>FOB</option><option>CIP</option><option>CIF</option><option>DAP</option><option>DDP</option></select></div><div class="form-group full"><label>추가 요청사항</label><textarea id="memo" rows="5" placeholder="기타 요청사항을 입력해주세요."></textarea></div></div><button class="submit">견적 문의 접수하기</button></form></div></div><script>function submitQuote(e){e.preventDefault();alert('현재 홈페이지 디자인용 기본 견적문의 폼입니다. 기존 Supabase 견적문의 기능을 연결하려면 기존 quote 페이지의 접수 스크립트를 이 폼에 연결하면 됩니다.');}</script></body></html>
